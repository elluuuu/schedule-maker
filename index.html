<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генератор графіка подій</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --ink:#172033; --muted:#5B6478; --line:#DCE1EC; --field:#F7F8FB;
  --brand:#1D3D96; --brand-ink:#FFFFFF; --focus:#FFC400;
  --warn:#7A4E00; --warn-bg:#FFF2CC; --err:#9B1028; --err-bg:#FDE6EA; --ok:#0D6B4F;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1424; --surface:#172039; --ink:#E7EBF4; --muted:#A2ACC1; --line:#2A3555; --field:#111A30;
    --brand:#8DA6FF; --brand-ink:#0E1424; --focus:#FFD43B;
    --warn:#FFD27A; --warn-bg:#3A2D0E; --err:#FF9EAC; --err-bg:#3C1620; --ok:#7FE0BE;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Golos Text","Segoe UI",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--surface)}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-0.01em}
.top p{margin:2px 0 0;color:var(--muted);font-size:15px}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

.app{display:grid;grid-template-columns:minmax(380px,600px) minmax(0,1fr);align-items:start}
.editor{padding:20px 28px 60px;display:flex;flex-direction:column;gap:18px}
.preview{position:sticky;top:0;height:100vh;overflow:auto;padding:20px 28px 40px;border-left:1px solid var(--line)}

.panel{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.panel h2,.panel summary{font-size:18px;font-weight:700;margin:0}
.panel summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.panel summary::-webkit-details-marker{display:none}
.panel summary::after{content:"+";font-size:22px;font-weight:400;color:var(--muted)}
details[open]>summary::after{content:"−"}
details[open]>summary{margin-bottom:14px}
.hint{color:var(--muted);font-size:14px;margin:4px 0 12px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
input[type=text],input[type=date],select{max-width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=color]{width:44px;height:36px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.hours-wrap{overflow-x:auto}
.hours{width:100%;border-collapse:collapse;font-size:15px;margin-top:14px}
.hours th{font-weight:600;color:var(--muted);text-align:left;font-size:13px;padding:0 4px 6px}
.hours td{padding:4px}
.hours input.tm{width:68px}
.hours tr.off td:not(:first-child){opacity:.45}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.small{padding:4px 9px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tabs button{border:1px solid var(--line);background:var(--field);border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:600;display:flex;gap:6px;align-items:baseline}
.tabs button small{font-weight:500;color:var(--muted);font-size:12px}
.tabs button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tabs button[aria-pressed="true"] small{color:inherit;opacity:.8}
.tabs button.off{opacity:.5}

.ev{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.ev:first-child{border-top:0}
.ev-a,.ev-b{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ev input.tm{width:70px;text-align:center;font-variant-numeric:tabular-nums}
.ev input.ti{flex:1 1 220px}
.ev input.rm{flex:0 1 130px}
.ev input.nt{flex:1 1 150px}
.ap{display:flex;align-items:center;gap:3px;font-size:14px;color:var(--muted);cursor:pointer}
.catsel{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;flex:none;display:inline-block}
.dash{color:var(--muted)}
.empty{color:var(--muted);padding:14px 0 6px;margin:0}
.daysel{display:flex;gap:4px;flex-wrap:wrap}
.daysel label{display:flex;align-items:center;gap:3px;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:3px 7px;cursor:pointer}

.ptools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.count{color:var(--muted);font-size:14px}

.checks{margin:0 0 16px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.checks li{padding:8px 12px;border-radius:9px;font-size:14px}
.checks li.err{background:var(--err-bg);color:var(--err)}
.checks li.warn{background:var(--warn-bg);color:var(--warn)}
.checks li.ok{color:var(--ok);padding-left:0}

.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.slides figure{margin:0;display:flex;flex-direction:column;gap:6px}
.slides canvas{width:100%;height:auto;border-radius:6px;border:1px solid var(--line);display:block;background:#fff}
.slides figcaption{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}

.logo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.logo-row img{height:44px;width:auto;border-radius:6px;border:1px solid var(--line);background:var(--field)}
.logo-row .name{min-width:130px;font-size:14px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}

@media (max-width: 960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .preview{position:static;height:auto;border-left:0;border-top:1px solid var(--line)}
  .editor,.preview{padding:16px}
  .top{padding:14px 16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1 data-t="appTitle"></h1>
    <p data-t="lead"></p>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-act="lang" data-v="uk">УКР</button>
    <button type="button" data-act="lang" data-v="en">ENG</button>
  </div>
</header>

<main class="app">
  <div class="editor" id="editor"></div>
  <section class="preview" aria-labelledby="pvTitle">
    <div class="ptools">
      <div class="row">
        <h2 id="pvTitle" style="margin:0;font-size:18px" data-t="preview"></h2>
        <span class="count" id="count"></span>
      </div>
      <div class="row">
        <div class="seg" role="group">
          <button type="button" data-act="fmt" data-v="ig" data-t="fmtIg"></button>
          <button type="button" data-act="fmt" data-v="tg" data-t="fmtTg"></button>
        </div>
        <button type="button" class="btn primary" data-act="zip" data-t="downloadAll"></button>
      </div>
    </div>
    <ul class="checks" id="checks" aria-live="polite"></ul>
    <div class="slides" id="slides"></div>
  </section>
</main>
<input type="file" id="importFile" accept="application/json,.json" hidden>

const KEY='schedule-maker-v1';

function normalize(o){

  s.labels=Object.assign(sample().labels, o.labels||{});

  s.daily=Array.isArray(o.daily)?o.daily.map(d=>Object.assign({t:'',c:'',st:'',all:true,s:'',e:'',days:[true,true,true,true,true,true]}, d)):[];
  s.days=o.days.map(d=>Object.assign({on:true,open:'11:00',close:'17:00',reg:'',byRoom:false,ev:[]}, d, {ev:(d.ev||[]).map(e=>Object.assign(E('','','',''), e))}));
  return s;
}
function load(){ try{ const raw=localStorage.getItem(KEY); return raw? normalize(JSON.parse(raw)) : null; }catch(e){ return null; } }

/* ---------- Helpers ---------- */
const list=s=>String(s||'').split(',').map(x=>x.trim());
function L(){ const l=S.labels; return Object.assign({}, l, {days:list(l.days), short:list(l.short), months:list(l.months)}); }
function mins(v){ const m=/^(\d{1,2}):(\d{2})$/.exec(v||''); return m? (+m[1])*60+(+m[2]) : null; }
function normTime(v){
  v=String(v||'').trim().replace(/[.,h ]/g,':');
  if(!v) return '';
  let m;
  if(/^\d{1,2}$/.test(v)) return v.padStart(2,'0')+':00';
  if((m=/^(\d{1,2})(\d{2})$/.exec(v))) return m[1].padStart(2,'0')+':'+m[2];
  if((m=/^(\d{1,2}):(\d{1,2})$/.exec(v))) return m[1].padStart(2,'0')+':'+m[2].padStart(2,'0');
  return v;
}
function byTime(a,b){ return (mins(a.s)??9999)-(mins(b.s)??9999) || (mins(a.e)??0)-(mins(b.e)??0); }
function dayDate(i){ const [y,m,d]=String(S.weekStart||'').split('-').map(Number); return (y&&m&&d)? new Date(y,m-1,d+i) : null; }
function ddmm(dt){ return dt? String(dt.getDate()).padStart(2,'0')+'.'+String(dt.getMonth()+1).padStart(2,'0') : ''; }
function catOf(id){ return S.cats.find(c=>c.id===id); }
function catColor(id){ const c=catOf(id); return c? c.color : '#6B7280'; }
function lowerFirst(s){ return s? s.charAt(0).toLocaleLowerCase()+s.slice(1) : s; }
function upperFirst(s){ return s? s.charAt(0).toLocaleUpperCase()+s.slice(1) : s; }
function timeStr(e){ return (e.ap?'≈ ':'')+e.s+(e.e?'–'+e.e:''); }
function daysLabel(idx, full){
  const D=L().days, SH=L().short;
  if(idx.length===1 && full) return D[idx[0]]||'';
  const runs=[]; idx.forEach(i=>{ const r=runs[runs.length-1]; if(r && i===r[1]+1) r[1]=i; else runs.push([i,i]); });
  return runs.map(([a,b])=> a===b? SH[a] : (b-a>=2? SH[a]+'–'+SH[b] : SH[a]+', '+SH[b])).join(', ');
}
function rangeText(){
  const on=S.days.map((d,i)=>d.on?i:-1).filter(i=>i>=0);
  if(!on.length) return '';
  const a=dayDate(on[0]), b=dayDate(on[on.length-1]); if(!a) return '';
  const mo=L().months;
  if(on.length===1) return `${a.getDate()} ${mo[a.getMonth()]||''}`.trim();
  if(a.getMonth()===b.getMonth()) return `${a.getDate()}–${b.getDate()} ${mo[a.getMonth()]||''}`.trim();
  return `${a.getDate()} ${mo[a.getMonth()]||''} – ${b.getDate()} ${mo[b.getMonth()]||''}`;
}
function hourGroups(){
  const gs=[];
  S.days.forEach((d,i)=>{ if(!d.on) return; const k=[d.open,d.close,d.reg].join('|'); let g=gs.find(g=>g.k===k); if(!g){ g={k,d,idx:[]}; gs.push(g); } g.idx.push(i); });
  return gs;
}
function dailyGroups(){
  const openIdx=S.days.map((d,i)=>d.on?i:-1).filter(i=>i>=0), gs=[];
  for(const it of S.daily){
    const title=(it.t||'').trim(); if(!title) continue;
    const idx=(it.days||[]).map((v,i)=>v&&S.days[i]&&S.days[i].on?i:-1).filter(i=>i>=0);
    if(!idx.length) continue;
    let g=gs.find(g=>g.t===title); if(!g){ g={t:title,c:it.c,st:it.st,parts:[]}; gs.push(g); }
    g.parts.push({idx, all:it.all, s:it.s, e:it.e});
  }
  gs.forEach(g=>{
    g.sched=upperFirst(g.parts.map(p=>{
      const every=p.idx.length===openIdx.length;
      const dl=every? '' : daysLabel(p.idx,false);
      const tm=p.all? L().hours : (p.s+(p.e?'–'+p.e:''));
      return (dl? dl+' ' : '')+tm;
    }).join(' · '));
  });
  return gs;
}
function usedCats(){
  const ids=new Set();
  S.days.forEach(d=>{ if(d.on) d.ev.forEach(e=>{ if(e.t.trim()) ids.add(e.c); }); });
  dailyGroups().forEach(g=>ids.add(g.c));
  return S.cats.filter(c=>ids.has(c.id));
}

/* ---------- Drawing ---------- */
const W=1080;
const FONT='"Golos Text","Segoe UI",Arial,sans-serif';
const INK='#14213D', TEXT='#1F2937', MUTED='#5B6478', LINE='#E3E6EF', PAGE='#F4F6FB';
const M={pad:56, timeW:190, gap:18, lh:36, rowPad:13, dot:28, pillGap:8, dayH:68, blockGap:34, headerH:190, footerH:112, top:34};
const NAME_X=M.pad+M.timeW+M.gap, TEXT_W=W-M.pad-NAME_X-M.dot;

function font(ctx,w,s){ ctx.font=`${w} ${s}px ${FONT}`; }
function spacing(ctx,px){ if('letterSpacing' in ctx) ctx.letterSpacing=px+'px'; }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrap(ctx,text,maxW){
  const words=String(text).split(/\s+/).filter(Boolean), lines=[]; let cur='';
  for(const w of words){ const t2=cur? cur+' '+w : w; if(!cur || ctx.measureText(t2).width<=maxW) cur=t2; else { lines.push(cur); cur=w; } }
  if(cur) lines.push(cur);
  return lines.length? lines : [''];
}
function fit(ctx,text,maxW){ if(ctx.measureText(text).width<=maxW) return text; let s=text; while(s.length>1 && ctx.measureText(s+'…').width>maxW) s=s.slice(0,-1); return s+'…'; }
const PILL={tag:{bg:null,stroke:'#C9CEDB',fg:'#374151'}, reg:{bg:'#FFE07A',fg:'#3B2F00'}, full:{bg:'#E5E7EB',fg:'#4B5563'}};
function pillW(ctx,text){ font(ctx,600,20); return ctx.measureText(text).width+20; }
function drawPill(ctx,x,base,text,kind){
  const k=PILL[kind]||PILL.tag, w=pillW(ctx,text);
  rr(ctx,x,base-24,w,32,8);
  if(k.bg){ ctx.fillStyle=k.bg; ctx.fill(); } else { ctx.strokeStyle=k.stroke; ctx.lineWidth=1.5; ctx.stroke(); }
  ctx.fillStyle=k.fg; ctx.fillText(text,x+10,base-1);
  return w;
}

const IMG={};
function loadImg(src){
  return new Promise(res=>{
    if(!src) return res();
    const have=IMG[src];
    if(have){ if(have.complete) return res(); have.addEventListener('load',()=>res(),{once:true}); have.addEventListener('error',()=>res(),{once:true}); return; }
    const i=new Image(); i.onload=()=>res(); i.onerror=()=>res(); i.src=src; IMG[src]=i;
  });
}
function img(src){ const i=src&&IMG[src]; return i&&i.complete&&i.naturalWidth? i : null; }

function layoutRow(ctx,e,showRoom){
  font(ctx,400,28);
  const lines=wrap(ctx,e.t.trim(),TEXT_W);
  const lab=L(), pills=[];
  if(showRoom && e.r) pills.push({t:e.r,k:'tag'});
  if(e.n) pills.push({t:e.n,k:'tag'});
  if(e.st==='reg') pills.push({t:lab.reg,k:'reg'});
  if(e.st==='full') pills.push({t:lab.full,k:'full'});
  let pw=0; pills.forEach(p=>{ p.w=pillW(ctx,p.t); pw+=p.w+M.pillGap; });
  font(ctx,400,28);
  const lastW=ctx.measureText(lines[lines.length-1]).width;
  const inline=pills.length>0 && lastW+pw<=TEXT_W;
  const n=lines.length+(pills.length && !inline ? 1 : 0);
  return {e,lines,pills,inline,lastW,h:M.rowPad*2+n*M.lh};
}
function drawRow(ctx,y,row,first){
  if(!first){ ctx.fillStyle=LINE; ctx.fillRect(M.pad,y,W-2*M.pad,1.5); }
  const base=y+M.rowPad+28, e=row.e;
  font(ctx,700,28); ctx.fillStyle=INK; ctx.fillText(timeStr(e),M.pad,base);
  ctx.fillStyle=catColor(e.c); rr(ctx,NAME_X,base-19,16,16,4); ctx.fill();
  font(ctx,400,28); ctx.fillStyle=TEXT;
  row.lines.forEach((l,i)=>ctx.fillText(l,NAME_X+M.dot,base+i*M.lh));
  let px, pb;
  if(row.inline){ px=NAME_X+M.dot+row.lastW+M.pillGap; pb=base+(row.lines.length-1)*M.lh; }
  else { px=NAME_X+M.dot; pb=base+row.lines.length*M.lh; }
  row.pills.forEach(p=>{ px+=drawPill(ctx,px,pb,p.t,p.k)+M.pillGap; });
}

function buildBlocks(ctx){
  const blocks=[];
  S.days.forEach((d,i)=>{
    if(!d.on) return;
    const evs=d.ev.filter(e=>e.t.trim() && mins(e.s)!==null).slice().sort(byTime);
    if(!evs.length) return;
    if(d.byRoom){
      const rooms=[...new Set(evs.map(e=>e.r.trim()))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
      rooms.forEach(r=>blocks.push({day:i, room:r||null, rows:evs.filter(e=>e.r.trim()===r).map(e=>layoutRow(ctx,e,false))}));
    } else {
      blocks.push({day:i, room:null, rows:evs.map(e=>layoutRow(ctx,e,true))});
    }
  });
  return blocks;
}
function pack(blocks,H){
  const avail=H-M.headerH-M.top-M.footerH, pages=[];
  const sum=rows=>rows.reduce((a,r)=>a+r.h,0);
  let cur=[], used=0;
  for(const b of blocks){
    let rows=b.rows, cont=false, guard=0;
    while(rows.length && guard++<200){
      const gap=cur.length? M.blockGap : 0;
      const need=gap+M.dayH+sum(rows);
      if(used+need<=avail){ cur.push({...b,rows,cont}); used+=need; rows=[]; break; }
      if(cur.length && M.dayH+sum(rows)<=avail){ pages.push(cur); cur=[]; used=0; continue; }
      const space=avail-used-gap-M.dayH; let take=0, acc=0;
      while(take<rows.length && acc+rows[take].h<=space){ acc+=rows[take].h; take++; }
      if(take<4 && cur.length){ pages.push(cur); cur=[]; used=0; continue; }
      if(!cur.length){ const parts=Math.ceil(sum(rows)/Math.max(space,1)); take=Math.min(take, Math.ceil(rows.length/parts)); }
      else if(rows.length-take<3 && take>3){ take=Math.max(3, rows.length-3); }
      if(take===0) take=1;
      cur.push({...b, rows:rows.slice(0,take), cont}); pages.push(cur); cur=[]; used=0;
      rows=rows.slice(take); cont=true;
    }
  }
  if(cur.length) pages.push(cur);
  return pages;
}

function drawCover(ctx,H,total){
  const P=64, lab=L(), acc=S.colors.accent;
  ctx.fillStyle=S.colors.primary; ctx.fillRect(0,0,W,H);
  let y=60, logoBottom=0, lw=0;
  const logo=img(S.logos.main);

  font(ctx,700,26); spacing(ctx,3); ctx.fillStyle=acc; ctx.fillText(fit(ctx,(S.centre||'').toLocaleUpperCase(),W-2*P-(lw?lw+30:0)),P,y+26); spacing(ctx,0);
  y+=46;
  font(ctx,800,112); ctx.fillStyle='#FFFFFF';
  const tl=wrap(ctx,S.title||'',W-2*P-(lw?lw+30:0));
  tl.forEach((l,i)=>ctx.fillText(l,P,y+96+i*108));
  y+=96+(tl.length-1)*108;
  font(ctx,700,58); ctx.fillStyle=acc; ctx.fillText(rangeText(),P,y+76);
  y+=76+44;
  if(logoBottom) y=Math.max(y,logoBottom+30);

function drawSlide(ctx,H,blocks,n,total){
  const lab=L();

  const days=[...new Set(blocks.map(b=>b.day))], ds=days.map(i=>S.days[i]);

    }
    y+=M.dayH;
    b.rows.forEach((r,ri)=>{ drawRow(ctx,y,r,ri===0); y+=r.h; });
  });

  const fl=img(S.logos.footer), fy=H-40;
  if(fl){ const h=60, w=h*fl.naturalWidth/fl.naturalHeight; ctx.save(); rr(ctx,M.pad,fy-h,w,h,8); ctx.clip(); ctx.drawImage(fl,M.pad,fy-h,w,h); ctx.restore(); }
  else { font(ctx,700,24); ctx.fillStyle=S.colors.primary; ctx.fillText(S.centre||'',M.pad,fy-20); }
  font(ctx,700,26); ctx.fillStyle=S.colors.primary; ctx.textAlign='right';
  ctx.fillText(`${n} / ${total}`+(n<total?'  →':''),W-M.pad,fy-20); ctx.textAlign='left';
}

function makeCanvas(H){ const c=document.createElement('canvas'); c.width=W; c.height=H; return c; }
function build(f){
  const H=f==='tg'?1920:1350;
  const mctx=makeCanvas(10).getContext('2d');
  const pages=pack(buildBlocks(mctx),H), total=pages.length+1, out=[];
  const c0=makeCanvas(H); const over=drawCover(c0.getContext('2d'),H,total); out.push(c0);
  pages.forEach((p,i)=>{ const c=makeCanvas(H); drawSlide(c.getContext('2d'),H,p,i+2,total); out.push(c); });
  return {canvases:out, coverOverflow:over};
}

/* ---------- Checks ---------- */
function checks(r){
  const out=[], D=L().days;
  S.days.forEach((d,i)=>{
    const name=D[i]||('#'+(i+1)), filled=d.ev.filter(e=>e.t.trim());
    if(!d.on){ if(filled.length) out.push(['warn',t('offDay',{day:name,n:filled.length})]); return; }
    const seen=new Set(), o=mins(d.open), c=mins(d.close);
    d.ev.forEach(e=>{
      const name2=e.t.trim();
      if(!name2){ if(e.s||e.e) out.push(['err',t('noTitle',{day:name,time:e.s||'?'})]); return; }
      const s=mins(e.s), en=e.e? mins(e.e) : null;
      if(s===null || (e.e && en===null)){ out.push(['err',t('badTime',{day:name,t:name2})]); return; }
      if(en!==null && en<=s) out.push(['err',t('endBefore',{day:name,t:name2})]);
      if(o!==null && c!==null && (s<o || (en??s)>c)) out.push(['warn',t('outside',{day:name,t:name2,h:d.open+'–'+d.close})]);
      const k=[e.s,e.e,name2.toLocaleLowerCase(),e.r.trim()].join('|');
      if(seen.has(k)) out.push(['warn',t('dupMsg',{day:name,t:name2,time:e.s})]); seen.add(k);
    });
  });
  const n=r.canvases.length;
  if(fmt==='tg' && n>10) out.push(['warn',t('tgMax',{n})]);
  if(fmt==='ig' && n>20) out.push(['warn',t('igMax',{n})]);
  if(r.coverOverflow) out.push(['warn',t('coverFull')]);
  return out;
}

/* ---------- Preview ---------- */
const fontsReady=(async()=>{ try{ await Promise.all(['400','500','600','700','800'].map(w=>document.fonts.load(`${w} 28px "Golos Text"`,'АаЇїBb12'))); await document.fonts.ready; }catch(e){} })();
let timer=null, last=null;
function schedule(){ clearTimeout(timer); timer=setTimeout(renderPreview,250); }
async function renderPreview(){
  await fontsReady;
  await Promise.all([loadImg(S.logos.main), loadImg(S.logos.footer)]);
  const r=build(fmt); last=r;
  const grid=document.getElementById('slides'); grid.innerHTML='';
  r.canvases.forEach((c,i)=>{
    const fig=document.createElement('figure');
    c.setAttribute('role','img'); c.setAttribute('aria-label',`${i+1} / ${r.canvases.length}`);
    fig.appendChild(c);
    const cap=document.createElement('figcaption');
    cap.innerHTML=`<span>${i+1} / ${r.canvases.length}</span><button type="button" class="btn small" data-act="dl" data-i="${i}">${esc(t('downloadOne'))}</button>`;
    fig.appendChild(cap); grid.appendChild(fig);
  });
  document.getElementById('count').textContent=t('slides',{n:r.canvases.length});
  const cs=checks(r), ul=document.getElementById('checks');
  ul.innerHTML=cs.length? cs.map(([k,m])=>`<li class="${k}">${esc(m)}</li>`).join('') : `<li class="ok">${esc(t('ok'))}</li>`;
}

/* ---------- Editor ---------- */

function det(key,title,body){ return `<details class="panel" data-key="${key}"${openState[key]?' open':''}><summary>${esc(title)}</summary>${body}</details>`; }

          <td><input type="text" class="tm" data-path="days.${i}.open" value="${esc(d.open)}" aria-label="${esc(t('from'))}"></td>
          <td><input type="text" class="tm" data-path="days.${i}.close" value="${esc(d.close)}" aria-label="${esc(t('to'))}"></td>
          <td><input type="text" class="tm" data-path="days.${i}.reg" value="${esc(d.reg)}" aria-label="${esc(t('regUntil'))}"></td>

  const daily=`
    <p class="hint">${esc(t('dailyHint'))}</p>

      <div class="ev">

          <input type="text" class="ti" data-path="daily.${k}.t" value="${esc(it.t)}" placeholder="${esc(t('evTitle'))}" aria-label="${esc(t('evTitle'))}">
        </div>
        <div class="ev-b">
          <label class="ap"><input type="checkbox" data-path="daily.${k}.all"${it.all?' checked':''}> ${esc(t('allHours'))}</label>
          ${it.all? '' : `<input type="text" class="tm" data-path="daily.${k}.s" value="${esc(it.s)}" placeholder="11:00" aria-label="${esc(t('from'))}"><span class="dash">–</span><input type="text" class="tm" data-path="daily.${k}.e" value="${esc(it.e)}" placeholder="17:00" aria-label="${esc(t('to'))}">`}
          <select data-path="daily.${k}.st" aria-label="${esc(t('stReg'))}">${stOpts(it.st)}</select>
        </div>
        <div class="ev-b">
          <div class="daysel">${SH.slice(0,6).map((s,i)=>`<label><input type="checkbox" data-path="daily.${k}.days.${i}"${it.days[i]?' checked':''}>${esc(s)}</label>`).join('')}</div>
          <button type="button" class="btn ghost small" data-act="delDaily" data-k="${k}">${esc(t('del'))}</button>
        </div>
      </div>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button type="button" class="btn" data-act="addDaily">${esc(t('addDaily'))}</button></div>`;

  const d=S.days[dayTab];
  const evRows=d.ev.map((e,k)=>{ const p=`days.${dayTab}.ev.${k}`; return `
    <div class="ev">
      <div class="ev-a">
        <input type="text" class="tm" data-path="${p}.s" value="${esc(e.s)}" placeholder="10:00" inputmode="numeric" aria-label="${esc(t('from'))}">
        <span class="dash">–</span>
        <input type="text" class="tm" data-path="${p}.e" value="${esc(e.e)}" placeholder="11:00" inputmode="numeric" aria-label="${esc(t('to'))}">
        <label class="ap" title="${esc(t('approx'))}"><input type="checkbox" data-path="${p}.ap"${e.ap?' checked':''} aria-label="${esc(t('approx'))}">≈</label>
        <input type="text" class="ti" data-path="${p}.t" value="${esc(e.t)}" placeholder="${esc(t('evTitle'))}" aria-label="${esc(t('evTitle'))}">
      </div>
      <div class="ev-b">
        ${catSel(p+'.c',e.c)}
        <input type="text" class="rm" data-path="${p}.r" value="${esc(e.r)}" placeholder="${esc(t('room'))}" aria-label="${esc(t('room'))}">
        <input type="text" class="nt" data-path="${p}.n" value="${esc(e.n)}" placeholder="${esc(t('note'))}" aria-label="${esc(t('note'))}">
        <select data-path="${p}.st" aria-label="${esc(t('stReg'))}">${stOpts(e.st)}</select>
        <button type="button" class="btn ghost small" data-act="dupEv" data-k="${k}">${esc(t('dup'))}</button>
        <button type="button" class="btn ghost small" data-act="delEv" data-k="${k}">${esc(t('del'))}</button>
      </div>
    </div>`; }).join('');
  const events=`
    <h2 style="margin-bottom:12px">${esc(t('events'))}</h2>
    <div class="tabs" role="group">${S.days.map((x,i)=>`<button type="button" data-act="tab" data-i="${i}" aria-pressed="${i===dayTab}" class="${x.on?'':'off'}">${esc(SH[i]||i+1)} <small>${x.ev.filter(e=>e.t.trim()).length}</small></button>`).join('')}</div>
    ${d.on? '' : `<p class="hint">${esc(t('dayOff'))}</p>`}
    <div id="evList">${evRows || `<p class="empty">${esc(t('noEvents'))}</p>`}</div>
    <div class="row" style="margin-top:12px">
      <button type="button" class="btn primary" data-act="addEv">${esc(t('addEvent'))}</button>
      <button type="button" class="btn" data-act="sortEv">${esc(t('sort'))}</button>
    </div>`;

  const cats=`
    <p class="hint">${esc(t('catsHint'))}</p>
    ${S.cats.map((c,k)=>`
      <div class="row" style="margin-bottom:8px">
        <input type="color" data-path="cats.${k}.color" value="${esc(c.color)}" aria-label="${esc(c.name)}">
        <input type="text" data-path="cats.${k}.name" value="${esc(c.name)}" style="flex:1" aria-label="${esc(t('cats'))}">
        <button type="button" class="btn ghost small" data-act="delCat" data-k="${k}">${esc(t('del'))}</button>
      </div>`).join('')}
    <button type="button" class="btn" data-act="addCat">${esc(t('addCat'))}</button>`;

  const logoRow=(key,label)=>`
    <div class="logo-row">
      <span class="name">${esc(label)}</span>
      ${S.logos[key]? `<img src="${S.logos[key]}" alt="">` : `<span class="dash">${esc(t('noLogo'))}</span>`}
      <label class="btn small">${esc(t('upload'))}<input type="file" accept="image/*" data-logo="${key}" hidden></label>
      ${S.logos[key]? `<button type="button" class="btn ghost small" data-act="rmLogo" data-k="${key}">${esc(t('remove'))}</button>` : ''}
    </div>`;
  const look=`
    <div class="row">
      <label class="f">${esc(t('primary'))}<input type="color" data-path="colors.primary" value="${esc(S.colors.primary)}"></label>
      <label class="f">${esc(t('accent'))}<input type="color" data-path="colors.accent" value="${esc(S.colors.accent)}"></label>
    </div>
    ${logoRow('main',t('logoMain'))}
    ${logoRow('footer',t('logoFooter'))}
    <p class="note">${esc(t('logoNote'))}</p>`;

  const lf=(k,label)=>`<label class="f">${esc(label)}<input type="text" data-path="labels.${k}" value="${esc(S.labels[k])}"></label>`;
  const texts=`
    <p class="hint">${esc(t('textsHint'))}</p>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${lf('days',t('lDays'))}${lf('short',t('lShort'))}${lf('months',t('lMonths'))}
      <div class="grid2">${lf('daily',t('lDaily'))}${lf('hours',t('lHours'))}${lf('regUntil',t('lRegUntil'))}${lf('reg',t('lReg'))}${lf('full',t('lFull'))}${lf('swipe',t('lSwipe'))}${lf('cont',t('lCont'))}${lf('and',t('lAnd'))}</div>
    </div>`;

  const data=`
    <p class="hint">${esc(t('dataHint'))}</p>
    <div class="row">
      <button type="button" class="btn" data-act="exportJson">${esc(t('exportJson'))}</button>
      <button type="button" class="btn" data-act="importJson">${esc(t('importJson'))}</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button type="button" class="btn" data-act="nextWeek">${esc(t('nextWeek'))}</button>
      <button type="button" class="btn ghost" data-act="clearEvents">${esc(t('clearEvents'))}</button>

  document.getElementById('editor').innerHTML =
    det('week',t('week'),week) +
    det('daily',t('daily'),daily) +
    `<section class="panel">${events}</section>` +
    det('cats',t('cats'),cats) +
    det('look',t('look'),look) +
    det('texts',t('texts'),texts) +
    det('data',t('data'),data);
}

/* ---------- Events ---------- */
function setPath(path,val){
  const k=path.split('.'); let o=S;
  for(let i=0;i<k.length-1;i++) o=o[/^\d+$/.test(k[i])? +k[i] : k[i]];
  const last=k[k.length-1]; o[/^\d+$/.test(last)? +last : last]=val;
}
function valueOf(el){ return el.type==='checkbox'? el.checked : el.value; }
function needsRerender(p){ return /^days\.\d+\.on$/.test(p) || /^daily\.\d+\.all$/.test(p) || /^cats\./.test(p) || /^labels\.(days|short)$/.test(p) || p==='weekStart'; }

const ed=document.getElementById('editor');
ed.addEventListener('input',e=>{
  const el=e.target.closest('[data-path]'); if(!el) return;
  setPath(el.dataset.path,valueOf(el)); save(); schedule();
});
ed.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.logo){ readLogo(el); return; }
  if(!el.dataset.path) return;
  if(el.classList.contains('tm')){ el.value=normTime(el.value); }
  setPath(el.dataset.path,valueOf(el)); save(); schedule();
  if(/\.c$/.test(el.dataset.path)){ const sw=el.parentElement.querySelector('.sw'); if(sw) sw.style.background=catColor(el.value); }
  if(needsRerender(el.dataset.path)) renderEditor();
});
ed.addEventListener('toggle',e=>{ const d=e.target; if(d.dataset && d.dataset.key) openState[d.dataset.key]=d.open; },true);

function readLogo(input){
  const file=input.files && input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const max=900, sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
      const c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*sc); c.height=Math.round(im.naturalHeight*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      S.logos[input.dataset.logo]=c.toDataURL('image/png'); save(); renderEditor(); schedule();
    };
    im.src=reader.result;
  };
  reader.readAsDataURL(file);
}

function blobOf(c){ return new Promise(r=>c.toBlob(r,'image/png')); }
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
function fileBase(){ return `schedule-${S.weekStart||'week'}-${fmt==='tg'?'telegram':'instagram'}`; }
async function downloadAll(){
  if(!last) return;
  const base=fileBase();
  if(window.JSZip){
    const z=new JSZip();
    for(let i=0;i<last.canvases.length;i++) z.file(`${base}-${String(i+1).padStart(2,'0')}.png`, await blobOf(last.canvases[i]));
    download(await z.generateAsync({type:'blob'}), base+'.zip');
  } else {
    for(let i=0;i<last.canvases.length;i++){ download(await blobOf(last.canvases[i]), `${base}-${String(i+1).padStart(2,'0')}.png`); await new Promise(r=>setTimeout(r,400)); }
  }
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, k=+b.dataset.k, d=S.days[dayTab];
  switch(a){
    case 'lang': S.lang=b.dataset.v; save(); renderChrome(); renderEditor(); renderPreview(); return;
    case 'fmt': fmt=b.dataset.v; renderChrome(); renderPreview(); return;
    case 'zip': downloadAll(); return;
    case 'dl': if(last){ const i=+b.dataset.i; download(await blobOf(last.canvases[i]), `${fileBase()}-${String(i+1).padStart(2,'0')}.png`); } return;
    case 'tab': dayTab=+b.dataset.i; renderEditor(); return;
    case 'addEv': {
      const prev=d.ev[d.ev.length-1];
      d.ev.push(E('','','',prev?prev.c:(S.cats[0]?.id||''),{r:prev&&d.byRoom?prev.r:''}));
      save(); renderEditor();
      const inputs=document.querySelectorAll('#evList .ev:last-child input.tm'); if(inputs[0]) inputs[0].focus();
      return;
    }
    case 'dupEv': d.ev.splice(k+1,0,clone(d.ev[k])); break;
    case 'delEv': d.ev.splice(k,1); break;
    case 'sortEv': d.ev.sort(byTime); break;
    case 'addDaily': S.daily.push({t:'',c:S.cats[0]?.id||'',st:'',all:true,s:'',e:'',days:[true,true,true,true,true,true]}); break;
    case 'delDaily': S.daily.splice(k,1); break;
    case 'addCat': S.cats.push({id:uid(),name:'',color:'#2F6FD0'}); break;
    case 'delCat': S.cats.splice(k,1); break;
    case 'rmLogo': S.logos[b.dataset.k]=null; break;
    case 'exportJson': download(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}), `schedule-${S.weekStart||'week'}.json`); return;
    case 'importJson': document.getElementById('importFile').click(); return;
    case 'nextWeek': {
      if(!confirm(t('confirmNext'))) return;
      const dt=dayDate(7); if(dt) S.weekStart=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      break;
    }
    case 'clearEvents': if(!confirm(t('confirmClear'))) return; S.days.forEach(x=>x.ev=[]); break;
    case 'reset': { if(!confirm(t('confirmReset'))) return; const lang=S.lang; S=sample(); S.lang=lang; break; }
    default: return;
  }
  save(); renderEditor(); schedule();
});

document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    let n=null; try{ n=normalize(JSON.parse(rd.result)); }catch(err){}
    if(!n){ alert(t('importErr')); return; }
    n.lang=S.lang; S=n; save(); renderEditor(); renderPreview();
  };
  rd.readAsText(f); e.target.value='';
});

renderChrome(); renderEditor(); renderPreview();
</script>
